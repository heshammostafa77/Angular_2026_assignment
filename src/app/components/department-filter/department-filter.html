<div class="flex gap-2 flex-wrap">
  @for (department of departments; track department) {
    <button
      [class]="employeeService.selectedDepartment() === department
        ? 'px-3 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white'
        : 'px-3 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200'"
      (click)="employeeService.toggleDepartment(department)"
    >
      {{ department }}
    </button>
  }
</div>
